name: build-push

on:
  push:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - 'examples/**'
      - 'samples/**'
      - 'scripts/**'
      - '.github/workflows/build-push.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Additional tag (e.g. v0.2)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  OWNER: linuxiscool
  IMAGE: iai-conversational-models

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        # GH runners ship with ~14GB free. Big AI images eat that. Free
        # what we can before buildx materializes layers.
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                       /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          DATESTAMP=$(date +%Y%m%d)
          EXTRA_TAG="${{ github.event.inputs.tag }}"
          TAGS="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}:latest"
          TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}:${DATESTAMP}"
          TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}:sha-${SHA_SHORT}"
          if [ -n "$EXTRA_TAG" ]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}:${EXTRA_TAG}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Tags: ${TAGS}"

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}:buildcache,mode=max

      - name: Post-push smoke (anonymous pull)
        run: |
          docker logout ${{ env.REGISTRY }}
          docker pull ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}:latest
          docker image inspect ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}:latest \
            --format 'Size: {{.Size}} bytes · Created: {{.Created}}'

      - name: Summary
        run: |
          {
            echo "# Build complete"
            echo
            echo "**Tags pushed:**"
            echo '${{ steps.tags.outputs.tags }}' | tr ',' '\n' | sed 's/^/- /'
            echo
            echo "**Anonymous pull:** OK"
            echo
            echo "Roshan handoff URL: \`ghcr.io/${{ env.OWNER }}/${{ env.IMAGE }}:latest\`"
          } >> $GITHUB_STEP_SUMMARY
